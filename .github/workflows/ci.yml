name: Native build and security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb@sha256:31c1aa20ba2d78c4cbc45b2675e40ffd6a3cd59897a9767ce88fc284309f55ab
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: lunixi_nop
          MARIADB_USER: lunixi_ci
          MARIADB_PASSWORD: isolated-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NOP_RUNTIME_PATH: ${{ github.workspace }}/.cache/nop-4.90.8
      LUNIXI_SDK_PROJECT: ${{ github.workspace }}/.cache/lunixi-dotnet/src/Lunixi.Sdk/Lunixi.Sdk.csproj
      LUNIXI_TEST_DB_CONFIG: ${{ github.workspace }}/.cache/test-db.json
      LUNIXI_PLUGIN_STAGING: ${{ github.workspace }}/artifacts/staging
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.320
      - name: Fetch checksum-pinned platform and versioned shared SDK
        run: python3 scripts/bootstrap.py
      - name: Clean-export restore regression
        run: python3 scripts/verify-clean-restore.py --nop-runtime "$NOP_RUNTIME_PATH" --sdk-source .cache/lunixi-dotnet
      - name: Prepare isolated test database configuration
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['LUNIXI_TEST_DB_CONFIG'])
          path.write_text(json.dumps(dict(host='127.0.0.1', port=3306, database='lunixi_nop', username='lunixi_ci', password='isolated-ci-only')))
          path.chmod(0o600)
          PY
      - name: Restore locked dependencies and build installable ZIP
        run: |
          dotnet restore tests/Lunixi.NopCommerce.Tests/Lunixi.NopCommerce.Tests.csproj --locked-mode
          python3 scripts/build.py
      - name: Native MariaDB lifecycle, security and packaged SDK tests
        run: dotnet test tests/Lunixi.NopCommerce.Tests/Lunixi.NopCommerce.Tests.csproj -c Release --no-restore
      - name: Format, script and dependency checks
        run: |
          for project in src/Nop.Plugin.Payments.Lunixi/Nop.Plugin.Payments.Lunixi.csproj src/Lunixi.NopCommerce.Gateway/Lunixi.NopCommerce.Gateway.csproj tests/Lunixi.NopCommerce.Tests/Lunixi.NopCommerce.Tests.csproj; do
            dotnet format "$project" --verify-no-changes --no-restore
          done
          node --check src/Nop.Plugin.Payments.Lunixi/Assets/checkout.js
          python3 -m py_compile scripts/bootstrap.py scripts/build.py
          dotnet list tests/Lunixi.NopCommerce.Tests/Lunixi.NopCommerce.Tests.csproj package --vulnerable --include-transitive --format json > artifacts/dependency-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/dependency-audit.json').read_text())
          assert not report.get('problems'), report.get('problems')
          assert not any(p.get('vulnerabilities') for project in report['projects'] for framework in project.get('frameworks', []) for group in ('topLevelPackages', 'transitivePackages') for p in framework.get(group, []))
          PY
      - name: Scan source and merchant artifact with pinned Gitleaks
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output .cache/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .cache/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .cache/gitleaks.tar.gz -C .cache gitleaks
          .cache/gitleaks dir . --config .gitleaks.toml --redact --no-banner
          printf '[extend]\nuseDefault = true\n' > .cache/default-gitleaks.toml
          .cache/gitleaks dir artifacts/staging --config .cache/default-gitleaks.toml --redact --no-banner
